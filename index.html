<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relaxing Fluid Simulation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: radial-gradient(circle at center, #060b2c 0%, #01020a 100%);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: rgba(255, 255, 255, 0.8);
    }

    #ui {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      backdrop-filter: blur(12px) saturate(150%);
      background: rgba(14, 24, 44, 0.55);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    #ui h1 {
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 4px;
    }

    #ui span {
      font-size: 12px;
      opacity: 0.75;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Chromatic Drift</h1>
    <span>Move the pointer or just watch the colors mingle.</span>
  </div>
  <canvas id="fluid"></canvas>
  <script>
    // WebGL Fluid Simulation by Pavel Dobryakov (MIT License)
    // Adapted with gentle defaults, automatic dye emitters, and relaxed visuals.

    const canvas = document.getElementById('fluid');
    const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true });
    if (!gl) {
      alert('WebGL 2 is required but not supported by your browser.');
    }

    const config = {
      SIM_RESOLUTION: 128,
      DYE_RESOLUTION: 512,
      DENSITY_DISSIPATION: 0.985,
      VELOCITY_DISSIPATION: 0.99,
      PRESSURE_ITERATIONS: 20,
      CURL: 35,
      SPLAT_RADIUS: 0.25,
      SPLAT_FORCE: 6000,
    };

    let pointers = [];
    let splatStack = [];
    let lastTime = performance.now();

    class Pointer {
      constructor() {
        this.id = -1;
        this.texcoordX = 0;
        this.texcoordY = 0;
        this.prevTexcoordX = 0;
        this.prevTexcoordY = 0;
        this.deltaX = 0;
        this.deltaY = 0;
        this.down = false;
        this.moved = false;
        this.color = [30, 0, 300];
      }
    }

    pointers.push(new Pointer());

    function scaleByPixelRatio(input) {
      const pixelRatio = window.devicePixelRatio || 1;
      return Math.floor(input * pixelRatio);
    }

    function normalizeColor(input) {
      const output = new Float32Array(3);
      output[0] = input[0] / 255;
      output[1] = input[1] / 255;
      output[2] = input[2] / 255;
      return output;
    }

    function getResolution(resolution) {
      let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
      if (aspect < 1) aspect = 1 / aspect;
      const min = Math.round(resolution);
      const max = Math.round(resolution * aspect);
      if (gl.drawingBufferWidth > gl.drawingBufferHeight) return { width: max, height: min };
      return { width: min, height: max };
    }

    class GLProgram {
      constructor(vertexShader, fragmentShader) {
        this.uniforms = {};
        this.program = gl.createProgram();
        gl.attachShader(this.program, vertexShader);
        gl.attachShader(this.program, fragmentShader);
        gl.linkProgram(this.program);
        if (!gl.getProgramParameter(this.program, gl.LINK_STATUS))
          throw gl.getProgramInfoLog(this.program);
        const uniformCount = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < uniformCount; i++) {
          const uniformName = gl.getActiveUniform(this.program, i).name;
          this.uniforms[uniformName] = gl.getUniformLocation(this.program, uniformName);
        }
      }

      bind() {
        gl.useProgram(this.program);
      }
    }

    class FBO {
      constructor(read, write) {
        this.read = read;
        this.write = write;
      }

      swap() {
        const tmp = this.read;
        this.read = this.write;
        this.write = tmp;
      }
    }

    function createFBO(texId, width, height, internalFormat, format, type, param) {
      gl.activeTexture(gl.TEXTURE0 + texId);
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, width, height, 0, format, type, null);

      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
      gl.viewport(0, 0, width, height);
      gl.clear(gl.COLOR_BUFFER_BIT);

      return { texture, fbo, width, height, texId };
    }

    function createDoubleFBO(texId, width, height, internalFormat, format, type, param) {
      const fbo1 = createFBO(texId, width, height, internalFormat, format, type, param);
      const fbo2 = createFBO(texId + 1, width, height, internalFormat, format, type, param);
      return new FBO(fbo1, fbo2);
    }

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function bindTexture(unit, texture) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return unit;
    }

    const baseVertexShader = compileShader(
      gl.VERTEX_SHADER,
      `#version 300 es
      precision highp float;
      layout (location = 0) in vec2 aPosition;
      out vec2 vUv;
      out vec2 vL;
      out vec2 vR;
      out vec2 vT;
      out vec2 vB;
      uniform vec2 texelSize;
      void main () {
        vUv = aPosition * 0.5 + 0.5;
        vL = vUv - vec2(texelSize.x, 0.0);
        vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y);
        vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }`
    );

    const blurVertexShader = compileShader(
      gl.VERTEX_SHADER,
      `#version 300 es
      precision highp float;
      layout (location = 0) in vec2 aPosition;
      out vec2 vUv;
      void main () {
        vUv = aPosition * 0.5 + 0.5;
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }`
    );

    const copyShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision mediump float;
      in vec2 vUv;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uTexture;
      void main () {
        fragColor = texture(uTexture, vUv);
      }`
    );

    const clearShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision mediump float;
      in vec2 vUv;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uTexture;
      uniform float value;
      void main () {
        fragColor = texture(uTexture, vUv) * value;
      }`
    );

    const displayShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision mediump float;
      in vec2 vUv;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uTexture;
      void main () {
        vec3 C = texture(uTexture, vUv).rgb;
        fragColor = vec4(C, 1.0);
      }`
    );

    const splatShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vUv;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uTarget;
      uniform vec2 point;
      uniform float radius;
      uniform float aspectRatio;
      uniform vec3 color;
      void main () {
        vec2 diff = vUv - point;
        diff.x *= aspectRatio;
        float dist = dot(diff, diff);
        float influence = exp(-dist / radius);
        vec3 base = texture(uTarget, vUv).rgb;
        fragColor = vec4(base + color * influence, 1.0);
      }`
    );

    const advectionShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vUv;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uVelocity;
      uniform sampler2D uSource;
      uniform vec2 texelSize;
      uniform float dt;
      uniform float dissipation;
      void main () {
        vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
        fragColor = dissipation * texture(uSource, coord);
      }`
    );

    const divergenceShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vUv;
      in vec2 vL;
      in vec2 vR;
      in vec2 vT;
      in vec2 vB;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uVelocity;
      void main () {
        float L = texture(uVelocity, vL).x;
        float R = texture(uVelocity, vR).x;
        float T = texture(uVelocity, vT).y;
        float B = texture(uVelocity, vB).y;
        float div = 0.5 * (R - L + T - B);
        fragColor = vec4(div, 0.0, 0.0, 1.0);
      }`
    );

    const curlShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vT;
      in vec2 vB;
      in vec2 vL;
      in vec2 vR;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uVelocity;
      void main () {
        float T = texture(uVelocity, vT).x;
        float B = texture(uVelocity, vB).x;
        float R = texture(uVelocity, vR).y;
        float L = texture(uVelocity, vL).y;
        float vorticity = R - L - T + B;
        fragColor = vec4(vorticity, 0.0, 0.0, 1.0);
      }`
    );

    const vorticityShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vUv;
      in vec2 vL;
      in vec2 vR;
      in vec2 vT;
      in vec2 vB;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uVelocity;
      uniform sampler2D uCurl;
      uniform float curl;
      uniform float dt;
      void main () {
        float L = texture(uCurl, vL).x;
        float R = texture(uCurl, vR).x;
        float T = texture(uCurl, vT).x;
        float B = texture(uCurl, vB).x;
        float C = texture(uCurl, vUv).x;
        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 0.0001;
        force *= curl * C;
        vec2 vel = texture(uVelocity, vUv).xy;
        fragColor = vec4(vel + force * dt, 0.0, 1.0);
      }`
    );

    const pressureShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vUv;
      in vec2 vL;
      in vec2 vR;
      in vec2 vT;
      in vec2 vB;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uPressure;
      uniform sampler2D uDivergence;
      void main () {
        float L = texture(uPressure, vL).x;
        float R = texture(uPressure, vR).x;
        float T = texture(uPressure, vT).x;
        float B = texture(uPressure, vB).x;
        float divergence = texture(uDivergence, vUv).x;
        float pressure = (L + R + T + B - divergence) * 0.25;
        fragColor = vec4(pressure, 0.0, 0.0, 1.0);
      }`
    );

    const gradientSubtractShader = compileShader(
      gl.FRAGMENT_SHADER,
      `#version 300 es
      precision highp float;
      in vec2 vUv;
      in vec2 vL;
      in vec2 vR;
      in vec2 vT;
      in vec2 vB;
      layout (location = 0) out vec4 fragColor;
      uniform sampler2D uPressure;
      uniform sampler2D uVelocity;
      void main () {
        float L = texture(uPressure, vL).x;
        float R = texture(uPressure, vR).x;
        float T = texture(uPressure, vT).x;
        float B = texture(uPressure, vB).x;
        vec2 velocity = texture(uVelocity, vUv).xy;
        velocity.xy -= vec2(R - L, T - B);
        fragColor = vec4(velocity, 0.0, 1.0);
      }`
    );

    let velocity, density, divergence, curl, pressure;
    let clearProgram, displayProgram, splatProgram, advectionProgram, divergenceProgram, curlProgram, vorticityProgram, pressureProgram, gradProgram;

    function initFramebuffers() {
      const simRes = getResolution(config.SIM_RESOLUTION);
      const dyeRes = getResolution(config.DYE_RESOLUTION);
      const texType = gl.HALF_FLOAT;
      const format = gl.RGBA16F;
      const internalFormat = gl.RGBA;
      const filtering = gl.LINEAR;

      velocity = createDoubleFBO(0, simRes.width, simRes.height, format, internalFormat, texType, filtering);
      density = createDoubleFBO(2, dyeRes.width, dyeRes.height, format, internalFormat, texType, filtering);
      divergence = createFBO(4, simRes.width, simRes.height, format, internalFormat, texType, gl.NEAREST);
      curl = createFBO(5, simRes.width, simRes.height, format, internalFormat, texType, gl.NEAREST);
      pressure = createDoubleFBO(6, simRes.width, simRes.height, format, internalFormat, texType, gl.NEAREST);
    }

    function initPrograms() {
      clearProgram = new GLProgram(baseVertexShader, clearShader);
      displayProgram = new GLProgram(blurVertexShader, displayShader);
      splatProgram = new GLProgram(baseVertexShader, splatShader);
      advectionProgram = new GLProgram(baseVertexShader, advectionShader);
      divergenceProgram = new GLProgram(baseVertexShader, divergenceShader);
      curlProgram = new GLProgram(baseVertexShader, curlShader);
      vorticityProgram = new GLProgram(baseVertexShader, vorticityShader);
      pressureProgram = new GLProgram(baseVertexShader, pressureShader);
      gradProgram = new GLProgram(baseVertexShader, gradientSubtractShader);
    }

    function updateCanvasSize() {
      const width = scaleByPixelRatio(window.innerWidth);
      const height = scaleByPixelRatio(window.innerHeight);
      canvas.width = width;
      canvas.height = height;
      gl.viewport(0, 0, width, height);
    }

    const blit = (() => {
      const quadVAO = gl.createVertexArray();
      gl.bindVertexArray(quadVAO);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, -1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 2, 1, 3]), gl.STATIC_DRAW);

      return destination => {
        gl.bindVertexArray(quadVAO);
        gl.bindFramebuffer(gl.FRAMEBUFFER, destination ? destination.fbo : destination);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      };
    })();

    function update() {
      const now = performance.now();
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      dt = Math.min(dt, 0.016);

      if (splatStack.length > 0) multipleSplats(splatStack.pop());

      gl.viewport(0, 0, velocity.read.width, velocity.read.height);

      curlProgram.bind();
      gl.uniform2f(curlProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(curlProgram.uniforms.uVelocity, bindTexture(0, velocity.read.texture));
      blit(curl);

      vorticityProgram.bind();
      gl.uniform2f(vorticityProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(vorticityProgram.uniforms.uVelocity, bindTexture(0, velocity.read.texture));
      gl.uniform1i(vorticityProgram.uniforms.uCurl, bindTexture(1, curl.texture));
      gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
      gl.uniform1f(vorticityProgram.uniforms.dt, dt);
      blit(velocity.write);
      velocity.swap();

      divergenceProgram.bind();
      gl.uniform2f(divergenceProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(divergenceProgram.uniforms.uVelocity, bindTexture(0, velocity.read.texture));
      blit(divergence);

      clearProgram.bind();
      gl.uniform2f(clearProgram.uniforms.texelSize, 1.0 / pressure.read.width, 1.0 / pressure.read.height);
      gl.uniform1i(clearProgram.uniforms.uTexture, bindTexture(0, pressure.read.texture));
      gl.uniform1f(clearProgram.uniforms.value, 0.8);
      blit(pressure.write);
      pressure.swap();

      pressureProgram.bind();
      gl.uniform2f(pressureProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(pressureProgram.uniforms.uDivergence, bindTexture(0, divergence.texture));
      for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
        gl.uniform1i(pressureProgram.uniforms.uPressure, bindTexture(1, pressure.read.texture));
        blit(pressure.write);
        pressure.swap();
      }

      gradProgram.bind();
      gl.uniform2f(gradProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(gradProgram.uniforms.uPressure, bindTexture(0, pressure.read.texture));
      gl.uniform1i(gradProgram.uniforms.uVelocity, bindTexture(1, velocity.read.texture));
      blit(velocity.write);
      velocity.swap();

      advectionProgram.bind();
      gl.uniform2f(advectionProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(advectionProgram.uniforms.uVelocity, bindTexture(0, velocity.read.texture));
      gl.uniform1i(advectionProgram.uniforms.uSource, bindTexture(1, velocity.read.texture));
      gl.uniform1f(advectionProgram.uniforms.dt, dt);
      gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
      blit(velocity.write);
      velocity.swap();

      gl.viewport(0, 0, density.read.width, density.read.height);

      advectionProgram.bind();
      gl.uniform2f(advectionProgram.uniforms.texelSize, 1.0 / density.read.width, 1.0 / density.read.height);
      gl.uniform1i(advectionProgram.uniforms.uVelocity, bindTexture(0, velocity.read.texture));
      gl.uniform1i(advectionProgram.uniforms.uSource, bindTexture(1, density.read.texture));
      gl.uniform1f(advectionProgram.uniforms.dt, dt);
      gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
      blit(density.write);
      density.swap();

      render();
      requestAnimationFrame(update);
    }

    function render() {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      displayProgram.bind();
      gl.uniform1i(displayProgram.uniforms.uTexture, bindTexture(0, density.read.texture));
      blit(null);
    }

    function splat(x, y, dx, dy, color) {
      gl.viewport(0, 0, velocity.read.width, velocity.read.height);
      splatProgram.bind();
      gl.uniform1i(splatProgram.uniforms.uTarget, bindTexture(0, velocity.read.texture));
      gl.uniform2f(splatProgram.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1f(splatProgram.uniforms.radius, config.SPLAT_RADIUS);
      gl.uniform1f(splatProgram.uniforms.aspectRatio, velocity.read.width / velocity.read.height);
      gl.uniform2f(splatProgram.uniforms.point, x, y);
      gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
      blit(velocity.write);
      velocity.swap();

      gl.viewport(0, 0, density.read.width, density.read.height);
      gl.uniform1i(splatProgram.uniforms.uTarget, bindTexture(0, density.read.texture));
      gl.uniform2f(splatProgram.uniforms.texelSize, 1.0 / density.read.width, 1.0 / density.read.height);
      gl.uniform1f(splatProgram.uniforms.aspectRatio, density.read.width / density.read.height);
      gl.uniform3f(splatProgram.uniforms.color, color[0], color[1], color[2]);
      blit(density.write);
      density.swap();
    }

    function multipleSplats(amount) {
      const pointer = pointers[0];
      for (let i = 0; i < amount; i++) {
        const color = normalizeColor([Math.random() * 255, Math.random() * 255, Math.random() * 255]);
        pointer.deltaX = Math.random() * 2 - 1;
        pointer.deltaY = Math.random() * 2 - 1;
        pointer.texcoordX = Math.random();
        pointer.texcoordY = Math.random();
        splat(pointer.texcoordX, pointer.texcoordY, pointer.deltaX * config.SPLAT_FORCE, pointer.deltaY * config.SPLAT_FORCE, color);
      }
    }

    function initEvents() {
      window.addEventListener('resize', () => {
        updateCanvasSize();
        initFramebuffers();
      });

      canvas.addEventListener('mousedown', e => {
        const pointer = pointers[0];
        pointer.down = true;
        pointer.moved = false;
        pointer.texcoordX = e.offsetX / canvas.clientWidth;
        pointer.texcoordY = 1.0 - e.offsetY / canvas.clientHeight;
        pointer.prevTexcoordX = pointer.texcoordX;
        pointer.prevTexcoordY = pointer.texcoordY;
      });

      window.addEventListener('mousemove', e => {
        const pointer = pointers[0];
        if (!pointer.down) return;
        const rect = canvas.getBoundingClientRect();
        pointer.texcoordX = (e.clientX - rect.left) / rect.width;
        pointer.texcoordY = 1.0 - (e.clientY - rect.top) / rect.height;
        pointer.deltaX = pointer.texcoordX - pointer.prevTexcoordX;
        pointer.deltaY = pointer.texcoordY - pointer.prevTexcoordY;
        pointer.prevTexcoordX = pointer.texcoordX;
        pointer.prevTexcoordY = pointer.texcoordY;
        const color = normalizeColor([
          170 + Math.sin(performance.now() * 0.0006) * 80,
          130 + Math.cos(performance.now() * 0.0009) * 90,
          255
        ]);
        splat(pointer.texcoordX, pointer.texcoordY, pointer.deltaX * config.SPLAT_FORCE, pointer.deltaY * config.SPLAT_FORCE, color);
        pointer.moved = true;
      });

      window.addEventListener('mouseup', () => {
        pointers[0].down = false;
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        while (pointers.length < e.touches.length) pointers.push(new Pointer());
        for (let i = 0; i < e.touches.length; i++) {
          const touch = e.touches[i];
          const pointer = pointers[i];
          pointer.id = touch.identifier;
          pointer.down = true;
          pointer.moved = false;
          const rect = canvas.getBoundingClientRect();
          pointer.texcoordX = (touch.clientX - rect.left) / rect.width;
          pointer.texcoordY = 1.0 - (touch.clientY - rect.top) / rect.height;
          pointer.prevTexcoordX = pointer.texcoordX;
          pointer.prevTexcoordY = pointer.texcoordY;
          pointer.color = normalizeColor([
            150 + Math.random() * 100,
            100 + Math.random() * 120,
            200 + Math.random() * 55
          ]);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        for (let i = 0; i < e.touches.length; i++) {
          const touch = e.touches[i];
          const pointer = pointers[i];
          const rect = canvas.getBoundingClientRect();
          pointer.texcoordX = (touch.clientX - rect.left) / rect.width;
          pointer.texcoordY = 1.0 - (touch.clientY - rect.top) / rect.height;
          pointer.deltaX = pointer.texcoordX - pointer.prevTexcoordX;
          pointer.deltaY = pointer.texcoordY - pointer.prevTexcoordY;
          pointer.prevTexcoordX = pointer.texcoordX;
          pointer.prevTexcoordY = pointer.texcoordY;
          splat(pointer.texcoordX, pointer.texcoordY, pointer.deltaX * config.SPLAT_FORCE, pointer.deltaY * config.SPLAT_FORCE, pointer.color);
          pointer.moved = true;
        }
      }, { passive: false });

      window.addEventListener('touchend', e => {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
          const pointer = pointers.find(p => p.id === touches[i].identifier);
          if (!pointer) continue;
          pointer.down = false;
        }
      });
    }

    let lastAutoSplat = 0;
    function autoSplats(timestamp) {
      if (timestamp - lastAutoSplat > 2600) {
        multipleSplats(Math.random() * 3 + 1);
        lastAutoSplat = timestamp;
      }
    }

    function updateAutoSplats(timestamp) {
      autoSplats(timestamp);
      requestAnimationFrame(updateAutoSplats);
    }

    function init() {
      if (!gl) return;
      const ext = gl.getExtension('EXT_color_buffer_float');
      if (!ext) {
        alert('Your browser does not support float color buffers needed for the simulation.');
        return;
      }
      initPrograms();
      updateCanvasSize();
      initFramebuffers();
      initEvents();
      multipleSplats(Math.random() * 20 + 10);
      requestAnimationFrame(update);
      requestAnimationFrame(updateAutoSplats);
    }

    init();
  </script>
</body>
</html>
